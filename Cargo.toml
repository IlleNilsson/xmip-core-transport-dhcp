[package]
name = "xmip-core-transport-dhcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-dhcp"
description = "DHCP transport: RFC 2131 over UDP — discover, request, release and inform arrive as Streams of their options, a Send Location offers, acknowledges or refuses a lease. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Standard library otherwise: DHCP is 236 fixed bytes, a
# magic cookie and tag-length-value options. Its declaration takes the
# capability's `timeout` (`transport::configured::timeout`).
transport = { workspace = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { workspace = true }
# The estate's encoding primitives: an option's bytes spelled in hex.
codec = { workspace = true, optional = true }
# The client hardware address in IEEE 802 notation, read and written once.
net = { workspace = true, optional = true }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "dep:codec", "dep:net"]
# The declaration alone.
declaration = []

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
